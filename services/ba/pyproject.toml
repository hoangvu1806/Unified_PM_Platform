[project]
name = "unify-ai-product"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk[db]>=2.5.0",
    "asyncpg>=0.30.0",
    "fastapi>=0.135.1",
    "litellm>=1.82.0",
    "openai>=2.26.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "psycopg2-binary>=2.9.12",
    "greenlet>=3.5.4",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.12",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Avoid setuptools "Multiple top-level packages" (frontend, tests, …).
[tool.setuptools.packages.find]
include = ["agents*", "managers*", "callbacks*", "config*", "utils*", "factory_wiki*"]
exclude = ["frontend*", "tests*", "docs*", "deploy*"]
