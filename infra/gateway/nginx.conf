# Single browser origin for every platform UI and API.
# Upstreams are resolved per request (Docker DNS), so the gateway also starts
# when only one module is running; a missing module answers 502.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 50m;   # BA -> Designer handoff carries up to 4 x 8MB data URLs

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ── Core API + Portal (Sprint 3) ─────────────────────
    location /api/core/ {
        set $up http://core-api:8100;
        proxy_pass $up;
    }

    # ── BA ───────────────────────────────────────────────
    location /ba/api/ {
        set $up http://ba-api:8000;
        rewrite ^/ba(/api/.*)$ $1 break;
        proxy_pass $up;
        proxy_buffering off;            # chat SSE
        proxy_read_timeout 1h;
    }
    location = /ba { return 301 /ba/; }
    location /ba/ {
        set $up http://ba-web:80;
        rewrite ^/ba/(.*)$ /$1 break;
        proxy_pass $up;
    }

    # ── Designer ─────────────────────────────────────────
    location /designer/api/ {
        set $up http://designer-api:8282;
        rewrite ^/designer(/api/.*)$ $1 break;
        proxy_pass $up;
        client_max_body_size 110m;      # design systems are imported from .fig files up to 100 MB
        proxy_buffering off;            # run events SSE
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location = /designer { return 301 /designer/; }
    location /designer/ {
        set $up http://designer-web:3232;
        rewrite ^/designer/(.*)$ /$1 break;
        proxy_pass $up;
    }

    # ── Portal ───────────────────────────────────────────
    location / {
        set $up http://portal-web:80;
        proxy_pass $up;
        proxy_intercept_errors on;
        error_page 502 503 504 = @no_portal;
    }
    location @no_portal {
        return 302 /ba/;
    }
}
