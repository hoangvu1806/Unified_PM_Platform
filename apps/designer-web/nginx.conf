# Static SPA only. The platform gateway strips /designer and proxies the API
# (/designer/api/) straight to designer-api, so no backend proxy lives here.
server {
    listen 3232;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Pages are revalidated on every load (they name the current hashed bundles);
    # hashed assets never change, so they are cached for a year.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
